
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Registration | Shivaji Youth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <a class="back-link" href="index.html">← Back to Home</a>

        <div class="auth-icon">🤝</div>
        <h1>Create Account</h1>
        <p>Join the Chatrapathi Shivaji Youth community.</p>

        <form id="registerForm">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName"
                   placeholder="Enter your full name" required>

            <label for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail"
                   placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter your phone number"
                   pattern="[0-9]{10}" maxlength="10" required>

            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword"
                   placeholder="Create a password"
                   minlength="8" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Re-enter your password"
                   minlength="8" required>

            <button class="auth-button" type="submit">
                Create Account
            </button>
        </form>

        <p id="registerMessage" class="form-message"
           aria-live="polite"></p>

        <p class="auth-footer">
            Already registered?
            <a href="user-login.html">Login</a>
        </p>
    </div>

    <script src="script.js"></script>

<script src="member-auth.js"></script>

<script>
    const registerForm = document.getElementById("registerForm");

    if (registerForm) {
        registerForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("fullName").value;
            const email = document.getElementById("registerEmail").value;
            const phone = document.getElementById("phone").value;
            const password =
                document.getElementById("registerPassword").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message = document.getElementById("registerMessage");

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            const result = registerMember(name, email, phone, password);

            message.textContent = result;

            if (result === "Registration successful!") {
                registerForm.reset();

                setTimeout(function() {
                    window.location.href = "user-login.html";
                }, 1000);
            }
        });
    }
</script>


</body>
</html>
