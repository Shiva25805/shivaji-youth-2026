
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Registration | Shivaji Youth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <a class="back-link" href="index.html">← Back to Home</a>

        <div class="auth-icon">🤝</div>
        <h1>Create Account</h1>
        <p>Join the Chatrapathi Shivaji Youth community.</p>

        <form id="registerForm">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName"
                   placeholder="Enter your full name" required>

            <label for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail"
                   placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter your phone number"
                   pattern="[0-9]{10}" maxlength="10" required>

            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword"
                   placeholder="Create a password"
                   minlength="8" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Re-enter your password"
                   minlength="8" required>

            <button class="auth-button" type="submit">
                Create Account
            </button>
        </form>

        <p id="registerMessage" class="form-message"
           aria-live="polite"></p>

        <p class="auth-footer">
            Already registered?
            <a href="user-login.html">Login</a>
        </p>
    </div>

    <script src="script.js"></script>

<script src="member-auth.js"></script>

     
<script>
        const registerForm = document.getElementById("registerForm");

if (registerForm) {
    registerForm.addEventListener("submit", async function(event) {
        event.preventDefault();

            const name = document.getElementById("fullName").value.trim();
            const email = document.getElementById("registerEmail").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const password = document.getElementById("registerPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("registerMessage");
            const submitButton = registerForm.querySelector('button[type="submit"]');

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            if (password.length < 8) {
                message.textContent = "Password must be at least 8 characters.";
                return;
            }

            message.textContent = "Creating your account...";
            submitButton.disabled = true;

            try {
                const response = await fetch(
                     (location.hostname === "localhost" ||
 location.hostname === "127.0.0.1")
    ? "http://127.0.0.1:8080/api/members/register"
    : "https://shivaji-youth-2026-backend.onrender.com/api/members/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({
                            name: name,
                            email: email,
                            phone: phone,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Registration failed.");
                }

                message.textContent = data.message || "Registration successful!";
                registerForm.reset();

                setTimeout(function() {
                    window.location.href = "user-login.html";
                }, 1000);

            } catch (error) {
                console.error("Registration error:", error);
                message.textContent =
                    error.message || "Could not connect to the backend.";
            } finally {
                submitButton.disabled = false;
            }
        });
    }
</script>



</body>
</html>
