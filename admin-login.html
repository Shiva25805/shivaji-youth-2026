
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Shivaji Youth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <a class="back-link" href="index.html">← Back to Home</a>

        <div class="auth-icon">🛡️</div>
        <h1>Admin Login</h1>
        <p>Sign in to manage the youth association.</p>

        <form id="adminLoginForm">
            <label for="adminEmail">Admin Email</label>
            <input type="email" id="adminEmail"
                   placeholder="Enter admin email" required>

            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword"
                   placeholder="Enter password" required>

            <button class="auth-button" type="submit">
                Login as Admin
                
            </button>
        </form>

        <p id="adminMessage" class="form-message"
           aria-live="polite"></p>

        <p class="auth-note">
            Authorized administrators only.
        </p>
        <button type="button" id="adminLogout">Logout</button>
    </div>
    

    <script src="script.js"></script>
    
<script>
document.getElementById("adminLogout").addEventListener("click", function () {
    sessionStorage.removeItem("shivajiAdminLoggedIn");
    window.location.replace("admin-login.html");
});
</script>

    
</body>
</html>
